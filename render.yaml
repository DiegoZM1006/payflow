services:
  - type: web
    name: payflow-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: '2'

databases:
  - name: payflow-db
    plan: free
    region: virginia
    databaseName: payflow
    user: payflow
