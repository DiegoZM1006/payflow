services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payflow -d payflow']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-docker-key}
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://payflow:payflow@db:5432/payflow
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  postgres_data: