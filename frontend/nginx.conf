server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths (/dashboard, /transactions) are handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change, so browsers can cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}